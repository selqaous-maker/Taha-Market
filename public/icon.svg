<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer subtle ring -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Barcode glyphs in center -->
  <g fill="#ffffff" transform="translate(96, 120)">
    <rect x="0" y="0" width="16" height="180" rx="4"/>
    <rect x="26" y="0" width="8" height="180" rx="4"/>
    <rect x="44" y="0" width="24" height="180" rx="4"/>
    <rect x="80" y="0" width="12" height="180" rx="4"/>
    <rect x="104" y="0" width="28" height="180" rx="4"/>
    <rect x="144" y="0" width="8" height="180" rx="4"/>
    <rect x="162" y="0" width="20" height="180" rx="4"/>
    <rect x="194" y="0" width="32" height="180" rx="4"/>
    <rect x="238" y="0" width="12" height="180" rx="4"/>
    <rect x="260" y="0" width="18" height="180" rx="4"/>
    <rect x="290" y="0" width="30" height="180" rx="4"/>
    
    <!-- Red laser scan line -->
    <line x1="-16" y1="90" x2="336" y2="90" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <!-- Text: TAHA MARKET -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">TAHA MARKET</text>
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#a7f3d0" text-anchor="middle" letter-spacing="4">POINT DE VENTE • CAISSE</text>
</svg>
